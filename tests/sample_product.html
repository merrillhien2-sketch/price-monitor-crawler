<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Open Graph URL -->
    <meta property="og:url" content="https://www.example-shop.com/product/10086">
    <title>小米14 Pro 16GB+512GB 黑色 5G智能手机 - 示例电商</title>
</head>
<body>
    <div id="header">
        <nav class="navbar">示例电商平台</nav>
    </div>

    <div class="product-detail-page">
        <div class="breadcrumb">
            <a href="/">首页</a> &gt; <a href="/category/phone">手机</a> &gt; 小米14 Pro
        </div>

        <!-- 商品图片区域 -->
        <div class="product-images">
            <img src="/images/mi14-pro-black.jpg" alt="小米14 Pro 黑色">
        </div>

        <!-- 商品信息区域 -->
        <div class="product-info">
            <!-- 商品标题：匹配 SELECTOR_TITLE = h1.product-title -->
            <h1 class="product-title">小米14 Pro 16GB+512GB 黑色 5G智能手机</h1>

            <!-- 价格区域 -->
            <div class="price-box">
                <!-- 当前价格：匹配 SELECTOR_PRICE = span.price -->
                <span class="price">¥4999.00</span>
                <!-- 原价：匹配 SELECTOR_ORIGINAL_PRICE = span.original-price -->
                <span class="original-price">¥5499.00</span>
                <span class="discount-tag">限时特惠</span>
            </div>

            <!-- 库存信息：匹配 SELECTOR_STOCK = span.stock -->
            <div class="stock-section">
                <span class="stock">有货</span>
            </div>

            <!-- SKU信息：data-sku 属性 -->
            <div class="sku-info" data-sku="MI14P-16512-BK">
                SKU: MI14P-16512-BK
            </div>

            <!-- 商品规格 -->
            <div class="specs">
                <table>
                    <tr><td>屏幕</td><td>6.73英寸 AMOLED</td></tr>
                    <tr><td>处理器</td><td>骁龙8 Gen3</td></tr>
                    <tr><td>内存</td><td>16GB</td></tr>
                    <tr><td>存储</td><td>512GB</td></tr>
                    <tr><td>电池</td><td>5000mAh</td></tr>
                </table>
            </div>
        </div>
    </div>

    <div id="footer">
        <p>版权所有 © 2024 示例电商平台</p>
    </div>
</body>
</html>
